[project]
name = "review-pulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thetsajeet", email = "ajeet.tumuluru@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=3.1.0",
    "jupyterlab>=4.6.6",
    "langchain>=1.4.10",
    "langchain-core>=1.7.7",
    "langchain-google-genai>=4.4.3",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
review-pulse = "review_pulse:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
